<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            },
            boxShadow: {
              luxury: '0 28px 70px rgba(15, 15, 15, 0.12)',
              soft: '0 16px 40px rgba(15, 15, 15, 0.08)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @keyframes confetti-fall {
        0% {
          opacity: 0;
          transform: translate3d(0, -48px, 0) rotate(0deg) scale(0.8);
        }

        16% {
          opacity: 1;
        }

        100% {
          opacity: 0;
          transform: translate3d(var(--fall-x), 190px, 0) rotate(var(--spin)) scale(1);
        }
      }

      .tip-card {
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fbfaf8;
        color: #000;
        transition:
          background 260ms ease,
          border-color 260ms ease,
          box-shadow 260ms ease,
          color 260ms ease,
          transform 260ms ease;
      }

      .tip-card:hover,
      .tip-card:focus-within {
        border-color: #000;
        background: #fff;
        box-shadow: 0 16px 40px rgba(15, 15, 15, 0.08);
        transform: translateY(-2px);
      }

      .tip-card .tip-meta {
        color: rgba(0, 0, 0, 0.35);
      }

      .tip-card.is-selected {
        border-color: #000;
        background: #000;
        color: #fff;
        box-shadow: 0 16px 40px rgba(15, 15, 15, 0.08);
      }

      .tip-card.is-selected .tip-meta {
        color: rgba(255, 255, 255, 0.52);
      }

      .tip-card.is-selected .custom-input {
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .tip-card.is-selected .custom-input::placeholder {
        color: rgba(255, 255, 255, 0.48);
      }

      .success-active #tippingScreen {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-10px) scale(0.97);
      }

      .success-active #successScreen {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .confetti-piece {
        animation: confetti-fall 1.45s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        animation-delay: var(--delay);
        background: var(--color);
        left: var(--left);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-[#f7f5f0] text-black antialiased">
    <main
      id="tipApp"
      class="relative mx-auto flex min-h-screen w-full max-w-md flex-col overflow-hidden bg-white shadow-luxury sm:my-6 sm:min-h-[calc(100vh-3rem)] sm:rounded-[2.25rem]"
    >
      <div
        id="tippingScreen"
        class="flex min-h-screen flex-col transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] sm:min-h-[calc(100vh-3rem)]"
      >
        <section class="relative flex flex-1 flex-col px-6 pb-44 pt-7 sm:px-8">
          <div
            class="pointer-events-none absolute inset-x-0 top-0 h-64 bg-[radial-gradient(circle_at_top,rgba(0,0,0,0.08),transparent_58%)]"
            aria-hidden="true"
          ></div>

          <header class="relative z-10 flex items-center justify-between">
            <p class="text-[0.72rem] font-semibold uppercase tracking-[0.42em] text-black">
              Tip.
            </p>
            <button
              class="rounded-full border border-black/10 px-4 py-2 text-xs font-medium uppercase tracking-[0.24em] text-black/70 transition hover:border-black hover:text-black"
              type="button"
            >
              Secure
            </button>
          </header>

          <div class="relative z-10 mt-12 flex flex-col items-center text-center">
            <div
              class="flex h-32 w-32 items-center justify-center rounded-full border border-black/10 bg-gradient-to-br from-[#fbfaf7] via-white to-[#e8e2d8] p-2 shadow-soft"
            >
              <div
                class="flex h-full w-full items-center justify-center rounded-full border border-white bg-[#111111] text-4xl font-light tracking-[-0.08em] text-white"
                aria-label="Worker photo placeholder"
              >
                M
              </div>
            </div>

            <p class="mt-8 text-xs font-medium uppercase tracking-[0.34em] text-black/45">
              Thank your host
            </p>
            <h1 class="mt-3 font-display text-6xl font-medium leading-none tracking-[-0.06em] text-black">
              Marco
            </h1>
            <p class="mt-4 max-w-[15rem] text-sm font-light leading-6 text-black/55">
              Hospitality Specialist at Costa Adeje
            </p>
          </div>

          <section class="relative z-10 mt-12" aria-labelledby="tip-options">
            <div class="flex items-end justify-between">
              <div>
                <p class="text-xs font-medium uppercase tracking-[0.32em] text-black/45">
                  Select amount
                </p>
                <h2 id="tip-options" class="mt-2 text-2xl font-light tracking-[-0.04em]">
                  Leave a tip
                </h2>
              </div>
              <p class="pb-1 text-xs font-light text-black/40">EUR</p>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-3">
              <button
                class="tip-card is-selected rounded-[1.35rem] px-5 py-6 text-left focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
                type="button"
                data-tip-button
                data-tip-cents="200"
                aria-pressed="true"
              >
                <span class="tip-meta block text-xs font-medium uppercase tracking-[0.28em] text-white/50">
                  Classic
                </span>
                <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€2</span>
              </button>

              <button
                class="tip-card rounded-[1.35rem] px-5 py-6 text-left focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
                type="button"
                data-tip-button
                data-tip-cents="500"
                aria-pressed="false"
              >
                <span class="tip-meta block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                  Generous
                </span>
                <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€5</span>
              </button>

              <button
                class="tip-card rounded-[1.35rem] px-5 py-6 text-left focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
                type="button"
                data-tip-button
                data-tip-cents="1000"
                aria-pressed="false"
              >
                <span class="tip-meta block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                  Signature
                </span>
                <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€10</span>
              </button>

              <label
                id="customTipCard"
                class="tip-card rounded-[1.35rem] px-5 py-5 text-left focus-within:outline-none focus-within:ring-2 focus-within:ring-black focus-within:ring-offset-2"
              >
                <span class="tip-meta block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                  Bespoke
                </span>
                <span class="mt-4 flex items-center gap-2 text-3xl font-light tracking-[-0.06em]">
                  <span>€</span>
                  <input
                    id="customAmount"
                    class="custom-input min-w-0 flex-1 rounded-2xl border border-black/10 bg-white/70 px-3 py-2 text-2xl font-light tracking-[-0.06em] outline-none transition placeholder:text-black/25"
                    type="number"
                    min="1"
                    step="0.5"
                    inputmode="decimal"
                    placeholder="Custom"
                    aria-label="Custom tip amount in euros"
                  />
                </span>
              </label>
            </div>
          </section>

          <section class="relative z-10 mt-10 rounded-[1.75rem] border border-black/10 bg-[#fbfaf8] p-5">
            <div class="flex items-start gap-4">
              <div class="mt-1 h-2 w-2 rounded-full bg-black"></div>
              <div>
                <h3 class="text-sm font-medium tracking-[-0.01em]">Private and effortless</h3>
                <p class="mt-2 text-sm font-light leading-6 text-black/50">
                  Your appreciation is confirmed instantly in this standalone demo flow.
                </p>
              </div>
            </div>
          </section>
        </section>

        <footer
          class="fixed inset-x-0 bottom-0 z-20 mx-auto w-full max-w-md border-t border-black/10 bg-white/90 px-6 pb-[calc(env(safe-area-inset-bottom)+1.25rem)] pt-4 shadow-[0_-18px_50px_rgba(255,255,255,0.95)] backdrop-blur-xl sm:absolute sm:rounded-b-[2.25rem] sm:px-8"
        >
          <div class="mb-4 flex items-center justify-between text-sm">
            <span class="font-light text-black/45">Selected tip</span>
            <span id="selectedTipDisplay" class="text-xl font-light tracking-[-0.06em]">€2.00</span>
          </div>
          <p id="checkoutStatus" class="mb-3 hidden text-sm font-light leading-5 text-red-600" role="alert"></p>
          <button
            id="payButton"
            class="flex w-full items-center justify-center gap-3 rounded-full bg-black px-6 py-4 text-base font-semibold tracking-[-0.02em] text-white transition duration-300 hover:-translate-y-0.5 hover:bg-[#1a1a1a] disabled:cursor-not-allowed disabled:opacity-60 disabled:hover:translate-y-0 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
            type="button"
          >
            <span id="payButtonPrimary" class="text-xl leading-none">Pay</span>
            <span class="h-5 w-px bg-white/25" aria-hidden="true"></span>
            <span id="payButtonSecondary" class="font-light">Apple Pay / Google Pay</span>
          </button>
        </footer>
      </div>

      <section
        id="successScreen"
        class="pointer-events-none absolute inset-0 flex min-h-screen flex-col items-center justify-center bg-white px-8 py-10 text-center opacity-0 transition-all duration-700 ease-[cubic-bezier(0.22,1,0.36,1)] [transform:translateY(18px)_scale(0.98)] sm:min-h-[calc(100vh-3rem)]"
        aria-hidden="true"
        inert
      >
        <div
          class="pointer-events-none absolute inset-x-8 top-20 h-56 overflow-hidden"
          aria-hidden="true"
        >
          <span
            class="confetti-piece absolute top-0 h-3 w-1.5 rounded-full"
            style="--left: 9%; --fall-x: -26px; --spin: 280deg; --delay: 0s; --color: #d5a542"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-4 w-1 rounded-full"
            style="--left: 21%; --fall-x: 18px; --spin: -320deg; --delay: 0.12s; --color: #111111"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-2.5 w-2.5 rounded-full"
            style="--left: 34%; --fall-x: -12px; --spin: 240deg; --delay: 0.24s; --color: #ead9b5"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-4 w-1.5 rounded-full"
            style="--left: 48%; --fall-x: 28px; --spin: -260deg; --delay: 0.05s; --color: #c59b3f"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-3 w-1 rounded-full"
            style="--left: 62%; --fall-x: -20px; --spin: 300deg; --delay: 0.18s; --color: #111111"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-2.5 w-2 rounded-full"
            style="--left: 76%; --fall-x: 14px; --spin: -280deg; --delay: 0.3s; --color: #f2e6cf"
          ></span>
          <span
            class="confetti-piece absolute top-0 h-4 w-1.5 rounded-full"
            style="--left: 89%; --fall-x: -18px; --spin: 330deg; --delay: 0.1s; --color: #d5a542"
          ></span>
        </div>

        <div class="relative z-10 flex w-full flex-1 flex-col items-center justify-center">
          <div
            class="flex h-28 w-28 items-center justify-center rounded-full border border-[#d5a542]/25 bg-[#fffaf0] shadow-[0_22px_60px_rgba(213,165,66,0.22)]"
          >
            <svg
              class="h-14 w-14 text-[#c59b3f]"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 12.5L9.25 16.75L19.5 6.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <p class="mt-10 text-xs font-medium uppercase tracking-[0.36em] text-[#a47d2f]">
            Success
          </p>
          <h2 class="mt-4 font-display text-6xl font-medium leading-none tracking-[-0.06em]">
            Thank you,
          </h2>
          <p class="mt-5 max-w-xs text-base font-light leading-7 text-black/55">
            Marco appreciate your Tip!
          </p>
        </div>

        <button
          id="closeSuccess"
          class="relative z-10 mb-[calc(env(safe-area-inset-bottom)+0.25rem)] flex w-full items-center justify-center rounded-full bg-black px-6 py-4 text-base font-semibold tracking-[-0.02em] text-white transition duration-300 hover:-translate-y-0.5 hover:bg-[#1a1a1a] focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
          type="button"
        >
          Close
        </button>
      </section>
    </main>

    <script>
      const app = document.getElementById('tipApp');
      const tippingScreen = document.getElementById('tippingScreen');
      const tipButtons = document.querySelectorAll('[data-tip-button]');
      const customTipCard = document.getElementById('customTipCard');
      const customAmount = document.getElementById('customAmount');
      const selectedTipDisplay = document.getElementById('selectedTipDisplay');
      const checkoutStatus = document.getElementById('checkoutStatus');
      const payButton = document.getElementById('payButton');
      const payButtonPrimary = document.getElementById('payButtonPrimary');
      const payButtonSecondary = document.getElementById('payButtonSecondary');
      const closeSuccess = document.getElementById('closeSuccess');
      const successScreen = document.getElementById('successScreen');

      let selectedTipCents = 200;
      let selectedTipType = 'preset';

      const formatEuro = (cents) =>
        new Intl.NumberFormat('en-IE', {
          style: 'currency',
          currency: 'EUR',
          minimumFractionDigits: 2,
        }).format(cents / 100);

      const showStatus = (message) => {
        checkoutStatus.textContent = message;
        checkoutStatus.classList.toggle('hidden', !message);
      };

      const setPayLoading = (isLoading) => {
        payButton.disabled = isLoading;
        payButtonPrimary.textContent = isLoading ? 'Confirming' : 'Pay';
        payButtonSecondary.textContent = isLoading ? 'Preparing thank you' : 'Apple Pay / Google Pay';
      };

      const setSelectedTip = (cents, type = 'preset') => {
        selectedTipCents = cents;
        selectedTipType = type;
        selectedTipDisplay.textContent = cents ? formatEuro(cents) : 'Custom';
        showStatus('');

        tipButtons.forEach((button) => {
          const isSelected = type === 'preset' && Number(button.dataset.tipCents) === cents;
          button.classList.toggle('is-selected', isSelected);
          button.setAttribute('aria-pressed', String(isSelected));
        });

        customTipCard.classList.toggle('is-selected', type === 'custom');
      };

      const getCustomTipCents = () => {
        const value = Number(customAmount.value);
        if (!Number.isFinite(value) || value <= 0) {
          return null;
        }

        return Math.round(value * 100);
      };

      const showSuccessScreen = () => {
        app.classList.add('success-active');
        successScreen.removeAttribute('inert');
        successScreen.setAttribute('aria-hidden', 'false');
        tippingScreen.setAttribute('inert', '');
        setPayLoading(false);
        window.setTimeout(() => closeSuccess.focus(), 450);
      };

      const hideSuccessScreen = () => {
        app.classList.remove('success-active');
        successScreen.setAttribute('aria-hidden', 'true');
        successScreen.setAttribute('inert', '');
        tippingScreen.removeAttribute('inert');

        if (window.location.search.includes('payment=success')) {
          window.history.replaceState({}, document.title, window.location.pathname);
        }

        payButton.focus();
      };

      const completeDemoPayment = () => {
        if (selectedTipType === 'custom') {
          const customCents = getCustomTipCents();

          if (!customCents) {
            selectedTipDisplay.textContent = 'Custom';
            showStatus('Please enter a custom tip amount before continuing.');
            customAmount.focus();
            return;
          }

          selectedTipCents = customCents;
          selectedTipDisplay.textContent = formatEuro(customCents);
        }

        showStatus('');
        setPayLoading(true);
        window.setTimeout(showSuccessScreen, 420);
      };

      tipButtons.forEach((button) => {
        button.addEventListener('click', () => {
          customAmount.value = '';
          setSelectedTip(Number(button.dataset.tipCents));
        });
      });

      customAmount.addEventListener('focus', () => {
        setSelectedTip(getCustomTipCents(), 'custom');
      });

      customAmount.addEventListener('input', () => {
        setSelectedTip(getCustomTipCents(), 'custom');
      });

      payButton.addEventListener('click', completeDemoPayment);
      closeSuccess.addEventListener('click', hideSuccessScreen);

      if (new URLSearchParams(window.location.search).get('payment') === 'success') {
        showSuccessScreen();
      }
    </script>
  </body>
</html>
