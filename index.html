<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              display: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            },
            boxShadow: {
              luxury: '0 28px 70px rgba(15, 15, 15, 0.12)',
              soft: '0 16px 40px rgba(15, 15, 15, 0.08)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-[#f7f5f0] text-black antialiased">
    <main
      class="mx-auto flex min-h-screen w-full max-w-md flex-col bg-white shadow-luxury sm:my-6 sm:min-h-[calc(100vh-3rem)] sm:overflow-hidden sm:rounded-[2.25rem]"
    >
      <section class="relative flex flex-1 flex-col px-6 pb-36 pt-7 sm:px-8">
        <div
          class="pointer-events-none absolute inset-x-0 top-0 h-64 bg-[radial-gradient(circle_at_top,rgba(0,0,0,0.08),transparent_58%)]"
          aria-hidden="true"
        ></div>

        <header class="relative z-10 flex items-center justify-between">
          <p class="text-[0.72rem] font-semibold uppercase tracking-[0.42em] text-black">
            Tip.
          </p>
          <button
            class="rounded-full border border-black/10 px-4 py-2 text-xs font-medium uppercase tracking-[0.24em] text-black/70 transition hover:border-black hover:text-black"
            type="button"
          >
            Secure
          </button>
        </header>

        <div class="relative z-10 mt-12 flex flex-col items-center text-center">
          <div
            class="flex h-32 w-32 items-center justify-center rounded-full border border-black/10 bg-gradient-to-br from-[#fbfaf7] via-white to-[#e8e2d8] p-2 shadow-soft"
          >
            <div
              class="flex h-full w-full items-center justify-center rounded-full border border-white bg-[#111111] text-4xl font-light tracking-[-0.08em] text-white"
              aria-label="Worker photo placeholder"
            >
              M
            </div>
          </div>

          <p class="mt-8 text-xs font-medium uppercase tracking-[0.34em] text-black/45">
            Thank your host
          </p>
          <h1 class="mt-3 font-display text-6xl font-medium leading-none tracking-[-0.06em] text-black">
            Marco
          </h1>
          <p class="mt-4 max-w-[15rem] text-sm font-light leading-6 text-black/55">
            Hospitality Specialist at Costa Adeje
          </p>
        </div>

        <section class="relative z-10 mt-12" aria-labelledby="tip-options">
          <div class="flex items-end justify-between">
            <div>
              <p class="text-xs font-medium uppercase tracking-[0.32em] text-black/45">
                Select amount
              </p>
              <h2 id="tip-options" class="mt-2 text-2xl font-light tracking-[-0.04em]">
                Leave a tip
              </h2>
            </div>
            <p class="pb-1 text-xs font-light text-black/40">EUR</p>
          </div>

          <div class="mt-6 grid grid-cols-2 gap-3">
            <button
              class="group rounded-[1.35rem] border border-black bg-black px-5 py-6 text-left text-white shadow-soft transition duration-300 hover:-translate-y-0.5 hover:shadow-luxury focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
              type="button"
              aria-pressed="true"
            >
              <span class="block text-xs font-medium uppercase tracking-[0.28em] text-white/50">
                Classic
              </span>
              <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€2</span>
            </button>

            <button
              class="group rounded-[1.35rem] border border-black/10 bg-[#fbfaf8] px-5 py-6 text-left transition duration-300 hover:-translate-y-0.5 hover:border-black hover:bg-white hover:shadow-soft focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
              type="button"
            >
              <span class="block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                Generous
              </span>
              <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€5</span>
            </button>

            <button
              class="group rounded-[1.35rem] border border-black/10 bg-[#fbfaf8] px-5 py-6 text-left transition duration-300 hover:-translate-y-0.5 hover:border-black hover:bg-white hover:shadow-soft focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
              type="button"
            >
              <span class="block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                Signature
              </span>
              <span class="mt-5 block text-4xl font-light tracking-[-0.08em]">€10</span>
            </button>

            <button
              class="group rounded-[1.35rem] border border-black/10 bg-white px-5 py-6 text-left transition duration-300 hover:-translate-y-0.5 hover:border-black hover:shadow-soft focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
              type="button"
            >
              <span class="block text-xs font-medium uppercase tracking-[0.28em] text-black/35">
                Bespoke
              </span>
              <span class="mt-5 block text-3xl font-light tracking-[-0.06em]">Custom</span>
            </button>
          </div>
        </section>

        <section class="relative z-10 mt-10 rounded-[1.75rem] border border-black/10 bg-[#fbfaf8] p-5">
          <div class="flex items-start gap-4">
            <div class="mt-1 h-2 w-2 rounded-full bg-black"></div>
            <div>
              <h3 class="text-sm font-medium tracking-[-0.01em]">Private and effortless</h3>
              <p class="mt-2 text-sm font-light leading-6 text-black/50">
                Your appreciation goes directly to Marco through a secure wallet checkout.
              </p>
            </div>
          </div>
        </section>
      </section>

      <footer
        class="fixed inset-x-0 bottom-0 z-20 mx-auto w-full max-w-md border-t border-black/10 bg-white/90 px-6 pb-[calc(env(safe-area-inset-bottom)+1.25rem)] pt-4 shadow-[0_-18px_50px_rgba(255,255,255,0.95)] backdrop-blur-xl sm:absolute sm:rounded-b-[2.25rem] sm:px-8"
      >
        <div class="mb-4 flex items-center justify-between text-sm">
          <span class="font-light text-black/45">Selected tip</span>
          <span class="text-xl font-light tracking-[-0.06em]">€2.00</span>
        </div>
        <button
          class="flex w-full items-center justify-center gap-3 rounded-full bg-black px-6 py-4 text-base font-semibold tracking-[-0.02em] text-white transition duration-300 hover:-translate-y-0.5 hover:bg-[#1a1a1a] focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2"
          type="button"
        >
          <span class="text-xl leading-none">Pay</span>
          <span class="h-5 w-px bg-white/25" aria-hidden="true"></span>
          <span class="font-light">Apple Pay / Google Pay</span>
        </button>
      </footer>
    </main>
  </body>
</html>
