<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TipTip Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #FFFFFF; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { width: 100%; max-width: 360px; text-align: center; }
        .logo { font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 8px; }
        .logo span { color: #D4AF37; }
        .subtitle { font-size: 14px; color: #8E8E93; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 40px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8E8E93; margin-bottom: 8px; }
        input { width: 100%; background: #1C1C1E; border: 1px solid #2C2C2E; padding: 16px; border-radius: 8px; color: #FFFFFF; font-size: 16px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #D4AF37; }
        .btn-login { width: 100%; background: #FFFFFF; color: #000000; border: none; padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        .btn-login:active { opacity: 0.8; }
        .error-message { color: #FF453A; font-size: 13px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo">TipTip<span>.</span></div>
    <div class="subtitle">Internal Portal</div>

    <div class="input-group">
        <label for="portalId">Passcode or ID</label>
        <input type="text" id="portalId" placeholder="Enter your credentials" autocomplete="off">
    </div>

    <button class="btn-login" type="button" onclick="handleLogin()">Enter Portal</button>
    <div class="error-message" id="error">Invalid credentials. Please check with your venue manager.</div>
</div>

<script>
    function handleLogin() {
        const id = document.getElementById('portalId').value.trim().toLowerCase();
        const errorEl = document.getElementById('error');

        // Simple intelligent routing for the prototype demo.
        if (id === 'marco' || id === 'ana' || id === 'worker') {
            window.location.href = 'worker.html';
        } else if (id === 'lumina' || id === 'manager') {
            window.location.href = 'manager.html';
        } else {
            errorEl.style.display = 'block';
        }
    }
</script>

</body>
</html>
