<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tip Manager Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #000000; color: #FFFFFF; min-height: 100vh; padding: 24px; }
        .portal { width: 100%; max-width: 420px; margin: 0 auto; }
        .logo { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; }
        .logo span { color: #D4AF37; }
        .subtitle { font-size: 12px; color: #8E8E93; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 32px; }
        .card { background: #1C1C1E; border: 1px solid #2C2C2E; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .card h1 { font-size: 24px; margin-bottom: 8px; }
        .card p { color: #C7C7CC; line-height: 1.5; }
        .status { color: #D4AF37; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; }
        a { color: #FFFFFF; display: inline-block; margin-top: 12px; text-decoration: none; }
    </style>
</head>
<body>
<main class="portal">
    <div class="logo">Tip<span>.</span></div>
    <div class="subtitle">Manager Portal</div>

    <section class="card">
        <div class="status">Signed in</div>
        <h1>Welcome, manager</h1>
        <p>This manager portal placeholder confirms the demo login route is working.</p>
        <a href="index.html">Back to login</a>
    </section>
</main>
</body>
</html>
