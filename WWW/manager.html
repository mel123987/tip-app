<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TipTip | Manager Portal</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="TipTip home">
        <span class="brand-mark">T</span>
        <span>TipTip</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Tip page</a>
        <a href="worker.html">Worker dashboard</a>
        <button class="link-button" type="button" data-sign-out>Sign out</button>
      </nav>
    </header>

    <main class="page-shell dashboard-shell">
      <section class="dashboard-hero">
        <div>
          <p class="eyebrow">Manager portal</p>
          <h1 id="managerGreeting">Loading portal...</h1>
          <p id="managerSubheading" class="hero-copy">Manage your team and review recorded tips.</p>
        </div>
        <div id="managerAuthBadge" class="auth-badge"></div>
      </section>

      <div id="managerStatus" class="status hidden" role="status"></div>

      <section class="stats-grid" aria-label="Tip totals">
        <article class="stat-card">
          <span>Total tips</span>
          <strong id="totalTips">$0.00</strong>
        </article>
        <article class="stat-card">
          <span>Recorded tips</span>
          <strong id="recordedTips">0</strong>
        </article>
        <article class="stat-card">
          <span>Paid tips</span>
          <strong id="paidTips">0</strong>
        </article>
        <article class="stat-card">
          <span>Active workers</span>
          <strong id="activeWorkers">0</strong>
        </article>
      </section>

      <section class="panel" aria-labelledby="add-worker-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Team setup</p>
            <h2 id="add-worker-title">Add a worker</h2>
          </div>
        </div>

        <form id="workerForm" class="stacked-form two-column-form">
          <div class="form-row">
            <label for="workerName">Worker name</label>
            <input id="workerName" name="name" required placeholder="Alex Rivera">
          </div>
          <div class="form-row">
            <label for="roleTitle">Role title</label>
            <input id="roleTitle" name="roleTitle" placeholder="Server, driver, stylist">
          </div>
          <div class="form-row">
            <label for="paymentHandle">Payment handle</label>
            <input id="paymentHandle" name="paymentHandle" placeholder="@alex or $alex">
          </div>
          <div class="form-row">
            <label for="paymentUrl">Payment URL</label>
            <input id="paymentUrl" name="paymentUrl" type="url" placeholder="https://venmo.com/u/alex">
          </div>
          <div class="form-row">
            <label for="photoUrl">Photo URL</label>
            <input id="photoUrl" name="photoUrl" type="url" placeholder="https://example.com/alex.jpg">
          </div>
          <div class="form-row">
            <label for="sortOrder">Display order</label>
            <input id="sortOrder" name="sortOrder" type="number" value="0">
          </div>
          <button class="primary-button full-span" type="submit">Add worker</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="workers-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Worker roster</p>
            <h2 id="workers-title">Workers</h2>
          </div>
          <button id="refreshManagerButton" class="ghost-button small" type="button">Refresh</button>
        </div>
        <div id="workerTable" class="responsive-table empty-state">No workers yet.</div>
      </section>

      <section class="panel" aria-labelledby="tips-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Tip activity</p>
            <h2 id="tips-title">Recent tips</h2>
          </div>
          <button id="exportTipsButton" class="ghost-button small" type="button">Export CSV</button>
        </div>
        <div id="tipsTable" class="responsive-table empty-state">No tips recorded yet.</div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/app.js"></script>
    <script src="assets/manager.js"></script>
  </body>
</html>
