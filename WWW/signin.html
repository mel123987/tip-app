<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TipTip | Sign In</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="TipTip home">
        <span class="brand-mark">T</span>
        <span>TipTip</span>
      </a>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="index.html">Tip page</a>
      </nav>
    </header>

    <main class="page-shell auth-shell">
      <section class="hero-card compact">
        <p class="eyebrow">Staff access</p>
        <h1>Sign in to your TipTip portal.</h1>
        <p class="hero-copy">
          Managers can add workers and review tips. Workers can claim a profile
          and monitor their own dashboard.
        </p>
      </section>

      <section class="panel auth-panel" aria-labelledby="auth-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Supabase Auth</p>
            <h2 id="auth-title">Welcome back</h2>
          </div>
        </div>

        <div class="tab-list" role="tablist" aria-label="Authentication options">
          <button id="signInTab" class="tab-button active" type="button" data-panel="signInPanel">Sign in</button>
          <button id="signUpTab" class="tab-button" type="button" data-panel="signUpPanel">Create account</button>
        </div>

        <div id="authStatus" class="status hidden" role="status"></div>

        <form id="signInForm" class="stacked-form auth-form" data-auth-panel="signInPanel">
          <div class="form-row">
            <label for="signInEmail">Email</label>
            <input id="signInEmail" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-row">
            <label for="signInPassword">Password</label>
            <input id="signInPassword" name="password" type="password" autocomplete="current-password" required>
          </div>

          <button class="primary-button" type="submit">Sign in</button>
          <button id="resetPasswordButton" class="ghost-button" type="button">Send password reset email</button>
        </form>

        <form id="signUpForm" class="stacked-form auth-form hidden" data-auth-panel="signUpPanel">
          <div class="form-row">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" autocomplete="name" required>
          </div>

          <div class="form-row">
            <label for="locationName">Business or location name</label>
            <input id="locationName" name="locationName" placeholder="Example: Downtown Cafe">
          </div>

          <div class="form-row">
            <label for="role">Account type</label>
            <select id="role" name="role" required>
              <option value="manager">Manager</option>
              <option value="worker">Worker</option>
            </select>
          </div>

          <div class="form-row">
            <label for="signUpEmail">Email</label>
            <input id="signUpEmail" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="form-row">
            <label for="signUpPassword">Password</label>
            <input id="signUpPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
          </div>

          <button class="primary-button" type="submit">Create account</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/app.js"></script>
    <script src="assets/signin.js"></script>
  </body>
</html>
